apiVersion: 1

contactPoints:
  - orgId: 1
    name: postgres-webhook
    receivers:
      - uid: postgres-webhook
        type: webhook
        settings:
          url: http://alert-receiver:5000/grafana
          httpMethod: POST
          # Matches ALERT_WEBHOOK_TOKEN in the alert-receiver container.
          # Leave the variable empty and set ALERT_WEBHOOK_AUTH_DISABLED=true
          # to run without auth locally.
          httpHeaders:
            X-Webhook-Token: ${ALERT_WEBHOOK_TOKEN}
