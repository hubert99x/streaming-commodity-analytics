name: "commodity_dbt"
version: "1.0.0"
profile: "commodity_dbt"

model-paths: ["models"]

packages-install-path: "/tmp/dbt_packages"

models:
  commodity_dbt:
    staging:
      +materialized: view
    # Default for marts; mart_latest_prices overrides it to a view.
    # Indexes are declared in each model's own post_hook, not here — dbt merges
    # hooks from both places, which previously created two indexes on
    # mart_minute_last_price.
    marts:
      +materialized: table